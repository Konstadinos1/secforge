<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecForge — Security Architect Academy</title>
<meta name="description" content="SecForge is a free training ground for aspiring Security Architects: theory modules, hands-on labs, phishing simulations, and a full cybersecurity career map. Gamified, offline-capable, yours.">
<meta property="og:title" content="SecForge — Security Architect Academy">
<meta property="og:description" content="Theory → Labs → Mastery. Train to become a Security Architect.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a0e14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v9c0 7.5 5.1 12.4 12 14 6.9-1.6 12-6.5 12-14V7L16 2z' fill='%2322d3ee'/%3E%3Cpath d='M16 6.5 8 9.6v6.4c0 5 3.4 8.5 8 9.9 4.6-1.4 8-4.9 8-9.9V9.6l-8-3.1z' fill='%230a0e14'/%3E%3Cpath d='M11 15.5l3.5 3.5L22 12' stroke='%2322d3ee' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<body>
<div id="app">
  <a class="skip" href="#view">Skip to content</a>

  <aside id="sidebar" aria-label="Primary">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 4 7v9c0 7.5 5.1 12.4 12 14 6.9-1.6 12-6.5 12-14V7L16 2z" fill="url(#lg)"/><path d="M16 6.5 8 9.6v6.4c0 5 3.4 8.5 8 9.9 4.6-1.4 8-4.9 8-9.9V9.6l-8-3.1z" fill="#0a0e14"/><path d="M11 15.5l3.5 3.5L22 12" stroke="#22d3ee" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs></svg>
      <div class="brand-text"><span class="brand-name">SEC<b>FORGE</b></span><span class="brand-sub">Architect Academy</span></div>
    </div>

    <nav id="nav">
      <a href="#/" data-route="dashboard"><span class="ico">◆</span> Dashboard</a>
      <a href="#/academy" data-route="academy"><span class="ico">▤</span> Academy</a>
      <a href="#/rush" data-route="rush"><span class="ico">⚡</span> Phish Rush <span class="mini-badge">ARCADE</span></a>
      <a href="#/careers" data-route="careers"><span class="ico">◈</span> Career Map</a>
      <a href="#/resources" data-route="resources"><span class="ico">❖</span> Resources</a>
      <a href="#/settings" data-route="settings"><span class="ico">⚙</span> Settings</a>
    </nav>

    <div class="side-foot">
      <div class="level-orb">
        <div class="orb-ring"><span id="side-level">1</span></div>
        <div>
          <div id="side-title" class="side-title">Initiate</div>
          <div class="xpbar"><div id="side-xpbar" class="xpbar-fill" style="width:0%"></div></div>
          <div id="side-xptext" class="side-xptext">0 XP</div>
        </div>
      </div>
      <div class="ver">SecForge v1.0 · free forever</div>
    </div>
  </aside>

  <div id="mainwrap">
    <header id="topbar">
      <button id="menu-btn" class="icon-btn" aria-label="Toggle menu">☰</button>
      <div id="crumb" class="crumb">Dashboard</div>
      <div class="top-right">
        <span id="streak-chip" class="chip streak" title="Daily streak">🔥 <b id="streak-n">0</b></span>
        <span class="chip xp-chip"><b id="xp-n">0</b> XP</span>
      </div>
    </header>

    <main id="view" tabindex="-1">
      <div class="boot">
        <pre class="boot-line">$ initializing secforge ...</pre>
      </div>
    </main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
