<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
/* igloo snowfall — gentle, reduced-motion aware */
(function () {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('snowfall');
  if (!c) return;
  const x = c.getContext('2d');
  let W, H, flakes = [];
  function size() { W = c.width = innerWidth; H = c.height = innerHeight; }
  function mk() { return { x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + .6, s: Math.random() * .45 + .18, o: Math.random() * .3 + .1, d: Math.random() * 6.28 }; }
  function init() { size(); flakes = Array.from({ length: Math.min(90, Math.floor(innerWidth / 14)) }, mk); }
  addEventListener('resize', init);
  init();
  (function tick() {
    x.clearRect(0, 0, W, H);
    for (const f of flakes) {
      f.y += f.s; f.d += .004; f.x += Math.sin(f.d) * .3;
      if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
      x.globalAlpha = f.o; x.fillStyle = '#dff3ff';
      x.beginPath(); x.arc(f.x, f.y, f.r, 0, 7); x.fill();
    }
    requestAnimationFrame(tick);
  })();
})();
</script>
